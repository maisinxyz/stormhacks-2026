<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fetch Play</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  /* camera feed and the transparent engine canvas are stacked full-viewport: no card, no camera rectangle */
  #bg, #curtain, .play-video, #pet { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #curtain { background: #000; opacity: 1; pointer-events: none; } /* starts dark, the shell fades it out once the first view is in */
  .play-video { object-fit: cover; background: #000; }
  .play-video.mirrored { transform: scaleX(-1); }
  #ui { position: absolute; inset: 0; pointer-events: none; color: #fff; font: 15px/1.35 system-ui, sans-serif; }
  .cam-ui { position: absolute; inset: 0; }
  .cam-btn { position: absolute; pointer-events: auto; width: 46px; height: 46px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.38); color: #fff; font-size: 22px; line-height: 1; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .cam-btn:focus-visible, .cam-card button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .cam-btn.tl { top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); }
  .cam-btn.tr { top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); }
  .cam-btn.br { bottom: calc(18px + env(safe-area-inset-bottom)); right: calc(14px + env(safe-area-inset-right)); }
  .cam-btn.bl { bottom: calc(18px + env(safe-area-inset-bottom)); left: calc(14px + env(safe-area-inset-left)); }
  .cam-btn.on { background: #e5484d; transform: scale(1.12); }
  .cam-btn:disabled { opacity: .4; }
  .cam-chips { position: absolute; right: calc(14px + env(safe-area-inset-right)); bottom: calc(74px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: auto; }
  .cam-chips[hidden] { display: none; }
  .cam-chip { min-height: 40px; padding: 8px 14px; border-radius: 20px; border: 0; background: rgba(0,0,0,.45); color: #fff; font: inherit;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .cam-chip:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .cam-shutter { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); pointer-events: auto;
    width: 72px; height: 72px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.25); padding: 0; }
  .cam-shutter:active { background: rgba(255,255,255,.6); }
  .cam-shutter:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .cam-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .cam-flash.go { animation: cam-flash .35s ease-out; }
  @keyframes cam-flash { from { opacity: .85; } to { opacity: 0; } }
  .cam-thumb { position: absolute; left: calc(14px + env(safe-area-inset-left)); bottom: calc(78px + env(safe-area-inset-bottom));
    width: 46px; height: 62px; object-fit: cover; border-radius: 8px; border: 2px solid #fff; }
  .cam-coach { position: absolute; left: 50%; bottom: calc(120px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: max-content; max-width: 84%;
    padding: 10px 16px; border-radius: 16px; background: rgba(0,0,0,.55); text-align: center; pointer-events: none; }
  .cam-coach p { margin: 0; } .cam-coach .tip { opacity: .85; font-size: 13px; margin-top: 4px; }
  .cam-toast { position: absolute; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%); max-width: 80%;
    padding: 8px 14px; border-radius: 18px; background: rgba(0,0,0,.5); text-align: center; opacity: 0; transition: opacity .25s; }
  .cam-toast.show { opacity: 1; }
  .cam-card { position: absolute; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(86%, 340px);
    pointer-events: auto; padding: 16px; border-radius: 18px; background: rgba(20,20,20,.82); text-align: center; }
  .cam-card p { margin: 0 0 12px; }
  .cam-card button { margin: 0 4px; padding: 10px 18px; border-radius: 22px; border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; font: inherit; }
  .cam-card button.primary { background: #fff; color: #111; border-color: #fff; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .cam-toast { transition: none; } .cam-flash.go { animation: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="pet"></canvas><div id="ui"></div></div>
<script type="module" src="/src/play/main.ts"></script>
</body>
</html>
