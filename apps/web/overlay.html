<!doctype html>
<html><head><meta charset="utf-8"><title>Fetch overlay</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Desktop overlay: no page background at all, the window is transparent and click-through. */
  :root { --ink: #1d1b18; --paper: rgba(255, 252, 245, .96); --accent: #f28c2b; --ok: #2f9e44; --line: rgba(0, 0, 0, .08);
    --shadow: 0 6px 22px rgba(0, 0, 0, .28), 0 1px 3px rgba(0, 0, 0, .2); font: 13px/1.35 system-ui, "Segoe UI", sans-serif; color: var(--ink); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #pet { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #peek { display: none; position: fixed; right: 12px; bottom: 12px; width: 170px; height: 170px; border-radius: 18px;
    background: linear-gradient(#dff0ff, #e7f3d6); box-shadow: var(--shadow); pointer-events: none; }
  .ui { position: fixed; z-index: 10; pointer-events: auto; }
  [hidden] { display: none !important; }
  .card { background: var(--paper); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .bubble { z-index: 20; max-width: 260px; padding: 8px 12px; border-radius: 14px; background: var(--paper); box-shadow: var(--shadow);
    transform: translate(-50%, -100%); pointer-events: none; animation: pop .18s ease-out; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: var(--paper);
    transform: translateX(-50%) rotate(45deg); box-shadow: 3px 3px 4px rgba(0, 0, 0, .08); }
  @keyframes pop { from { transform: translate(-50%, -90%) scale(.9); opacity: 0 } }
  .menu { padding: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 248px; animation: fade .12s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px) } }
  .menu button, .btn { all: unset; cursor: pointer; padding: 6px 8px; border-radius: 9px; white-space: nowrap; }
  .menu button:hover, .menu button:focus-visible { background: rgba(242, 140, 43, .16); }
  .menu .wide { grid-column: 1 / -1; font-weight: 600; text-align: center; background: rgba(242, 140, 43, .12); }
  .task { display: flex; gap: 6px; padding: 6px; width: 300px; }
  .task input { flex: 1; border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; font: inherit; outline: none; background: #fff; }
  .task input:focus { border-color: var(--accent); }
  .btn { padding: 7px 12px; font-weight: 600; text-align: center; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.approve { background: var(--ok); color: #fff; }
  .btn.ghost { background: rgba(0, 0, 0, .06); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .approval { width: 300px; padding: 10px 12px; }
  .approval h4 { margin: 0 0 6px; font-size: 13px; }
  .approval .meta { font-size: 12px; color: #555; margin: 2px 0; word-break: break-word; }
  .approval pre { margin: 6px 0; max-height: 120px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12px/1.35 inherit;
    background: rgba(0, 0, 0, .04); border-radius: 8px; padding: 6px 8px; user-select: text; }
  .approval .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  .approval .hint { font-size: 11px; color: #777; margin-top: 6px; }
  .chip { right: 12px; bottom: 190px; padding: 6px 8px 6px 12px; display: flex; gap: 8px; align-items: center; max-width: 300px; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .btn { padding: 2px 8px; }
</style></head>
<body>
<canvas id="pet"></canvas>
<canvas id="peek"></canvas>
<div id="bubble" class="ui bubble" hidden></div>
<div id="menu" class="ui card menu" role="menu" hidden></div>
<form id="task" class="ui card task" hidden><input id="task-input" placeholder="Give me a task..." autocomplete="off" aria-label="Task for your pet"><button class="btn primary" type="submit">Go</button></form>
<div id="approval" class="ui card approval" role="dialog" aria-label="Approval needed" hidden></div>
<div id="chip" class="ui card chip" hidden><span id="chip-text"></span><button id="chip-cancel" class="btn ghost" type="button" aria-label="Cancel task">Stop</button></div>
<script type="module" src="/src/overlay/main.ts"></script>
</body></html>
